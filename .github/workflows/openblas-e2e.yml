name: OpenBLAS wheel isolation
on:
  push:
    paths: &wheel_paths
      - '.github/workflows/openblas-e2e.yml'
      - 'scripts/build-wheel.sh'
      - 'scripts/openblas_isolation.py'
      - 'scripts/gcc-licences/**'
      - 'scripts/test-openblas-e2e.sh'
      - 'tests/test_openblas*.py'
  pull_request:
    paths: *wheel_paths
permissions:
  contents: read
jobs:
  openblas-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and Python
        run: sudo apt-get update && sudo apt-get install -y gcc python3-venv
      - name: Run OpenBLAS vendor end-to-end test
        run: scripts/test-openblas-e2e.sh
