name: Mirror community dataset

# Pulls the public community-data read routes and commits a snapshot to
# the dedicated `community-data` branch, always as github-actions[bot],
# so external submitters never appear in the contributor graph and this
# repo's main history stays clean. Reads no secret: the endpoints are
# public and unauthenticated.
#
# Snapshot layout on `community-data` (only path on that branch):
#   snapshot/latest.jsonl   one JSON record per line (summaries only;
#                           archive blobs are never mirrored)
#   snapshot/index.json     generated_at, schema_version, count, bytes,
#                           sha256, truncated flag, source URL
#   snapshot/SUMMARY.md     short generated table linking each record
#                           and its archive URL on the endpoint

on:
  schedule:
    - cron: "17 3 * * *" # daily, off the top of the hour
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-data-mirror
  cancel-in-progress: false

env:
  # Repository variable with a documented default; never a secret.
  # Set COMMUNITY_DATA_BASE_URL in repo settings if the worker lands on
  # a different URL.
  BASE_URL: ${{ vars.COMMUNITY_DATA_BASE_URL || 'https://mlx-omarchy-community-data.joshua-s-warren.workers.dev' }}

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the community-data branch; nothing more
    steps:
      - uses: actions/checkout@v4

      - name: Fetch public dataset
        # The script exits 0 without writing anything when the endpoint
        # is absent or unreachable, so this never fails repo status.
        run: |
          python3 scripts/mirror_community_data.py \
            --base-url "$BASE_URL" \
            --out-dir "$RUNNER_TEMP/snapshot"

      - name: Commit snapshot to community-data
        run: |
          set -euo pipefail
          if [ ! -s "$RUNNER_TEMP/snapshot/latest.jsonl" ]; then
            echo "No dataset fetched; nothing to mirror."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin community-data >/dev/null 2>&1; then
            git fetch --depth=1 origin community-data
            git switch -C community-data FETCH_HEAD
          else
            git switch --orphan community-data
            git rm -rf --ignore-unmatch --quiet .
          fi
          rm -rf snapshot
          cp -r "$RUNNER_TEMP/snapshot" snapshot
          git add snapshot
          if [ -z "$(git status --porcelain snapshot)" ]; then
            echo "Snapshot unchanged; no commit."
            exit 0
          fi
          git commit -m "community data snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ) from $BASE_URL"
          git push origin community-data

      - name: Check deployed schema identity
        # Runs last so the mirror always completes, but still fails the job
        # loudly. A stale worker deploy rejects every current-collector
        # submission with a 422 and is otherwise silent -- the endpoint keeps
        # serving reads, so nothing else here would notice. Exits 2 when the
        # live schema_sha256 / fields_sha256 differ from the bundled schema.
        # The commit step leaves the checkout on the snapshot-only
        # community-data branch, so return to the commit this run checked out
        # before reading the script from the repo.
        run: |
          git checkout --force --detach "$GITHUB_SHA"
          python3 services/community-data/scripts/check_schema_identity.py \
            --url "$BASE_URL"
