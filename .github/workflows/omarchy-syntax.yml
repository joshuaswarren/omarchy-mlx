name: Omarchy backend syntax gate

# Deep compile gate for the omarchy overlay translation units, beyond the
# cheap scripts/check_compute_kernel_wiring.py text gate that runs in the
# pre-push hook. Configures the pinned MLX tree (mlx.lock) CPU-only with
# the omarchy backend, builds the 559 embedded SPIR-V shader headers, then
# rewrites every omarchy backend compile to -fsyntax-only
# (scripts/ci/omarchy_syntax_check.py). No link, no GPU, no wheel.
#
# Measured on a 16-core dev box: prepare 7.6 s, configure 6.2 s, shaders
# 8.7 s (~80 s CPU), syntax 12.5 s (~46 s CPU) — a 4-vCPU runner fits the
# gate job in roughly 2-3 minutes including apt.
#
# The `tests` job runs the omarchy_custom_kernel_translate_tests unit
# suite for the MSL->GLSL translator, which the syntax-only gate cannot
# execute (no link): CPU-only libmlx plus the test target, then the suite.
# It needs the gate to pass first, so a broken backend stops in minutes
# instead of burning a full libmlx build. The cost of `needs:` is the
# ~2-minute shared setup run twice per push that passes the gate — the
# two jobs ran merged from 2026-11 until this re-split, and the 30-day CI
# baseline showed the merged job averaging ~68 min wall per run.
#
# Preprocessor-state limitation: the backend's bf16 direct GEMM path is
# enabled only when the configured shader compiler accepts GL_EXT_bfloat16
# (shaderc/glslc and recent glslang do; glslang 12 does not). The probe at
# configure time picks the state, so the gate always validates the exact
# state a build on that toolchain would compile; glslc-only coverage comes
# from the jw16 gate builds.

on:
  push:
    branches: [main]
    paths: &backend-paths
      - 'overlay/**'
      - 'patches/**'
      - 'mlx.lock'
      - 'scripts/prepare-mlx.sh'
      - 'scripts/ci/omarchy_syntax_check.py'
      - 'tests/test_omarchy_syntax_check.py'
      - '.github/workflows/omarchy-syntax.yml'
  pull_request:
    paths: *backend-paths
  workflow_dispatch:

concurrency:
  group: omarchy-syntax-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    # Fast part only: checkout through the -fsyntax-only sweep. Measured
    # 2-3 min end to end; 10 catches a real hang without holding a runner.
    timeout-minutes: 10
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@v4
      - name: Cache pinned MLX source archive
        uses: actions/cache@v4
        with:
          path: .work/mlx-*.tar.gz
          key: mlx-archive-${{ hashFiles('mlx.lock') }}
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build glslang-tools libvulkan-dev \
            libopenblas-dev libblas-dev liblapack-dev liblapacke-dev mesa-vulkan-drivers
      - name: Test syntax-check command handling
        run: python3 -m unittest discover -s tests -p test_omarchy_syntax_check.py -v
      - name: Prepare patched MLX tree
        run: bash scripts/prepare-mlx.sh
      - name: Configure (CPU-only, omarchy backend, tests on)
        env:
          CMAKE_INCLUDE_PATH: /usr/include/openblas
        run: |
          cmake -S .work/mlx -B .work/build -G Ninja \
            -DMLX_BUILD_OMARCHY=ON -DMLX_BUILD_CPU=ON \
            -DMLX_BUILD_METAL=OFF -DMLX_BUILD_CUDA=OFF \
            -DMLX_BUILD_TESTS=ON -DMLX_BUILD_EXAMPLES=OFF \
            -DMLX_BUILD_BENCHMARKS=OFF -DMLX_BUILD_PYTHON_BINDINGS=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_BUILD_TYPE=Release
      - name: Build embedded shader headers
        run: cmake --build .work/build --target omarchy_shaders
      - name: Syntax-check omarchy translation units
        run: python3 scripts/ci/omarchy_syntax_check.py .work/build --jobs 2

  tests:
    needs: gate
    runs-on: ubuntu-24.04
    # Long part: CPU-only libmlx plus the translator/vocab test targets.
    # Last 20 merged-job runs measured 6.3-17.5 min for this half on top of
    # shared setup; 30 covers the worst case with margin.
    timeout-minutes: 30
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@v4
      - name: Cache pinned MLX source archive
        uses: actions/cache@v4
        with:
          path: .work/mlx-*.tar.gz
          key: mlx-archive-${{ hashFiles('mlx.lock') }}
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build glslang-tools libvulkan-dev \
            libopenblas-dev libblas-dev liblapack-dev liblapacke-dev mesa-vulkan-drivers
      - name: Prepare patched MLX tree
        run: bash scripts/prepare-mlx.sh
      - name: Configure (CPU-only, omarchy backend, tests on)
        env:
          CMAKE_INCLUDE_PATH: /usr/include/openblas
        run: |
          cmake -S .work/mlx -B .work/build -G Ninja \
            -DMLX_BUILD_OMARCHY=ON -DMLX_BUILD_CPU=ON \
            -DMLX_BUILD_METAL=OFF -DMLX_BUILD_CUDA=OFF \
            -DMLX_BUILD_TESTS=ON -DMLX_BUILD_EXAMPLES=OFF \
            -DMLX_BUILD_BENCHMARKS=OFF -DMLX_BUILD_PYTHON_BINDINGS=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_BUILD_TYPE=Release
      - name: Build embedded shader headers
        run: cmake --build .work/build --target omarchy_shaders
      - name: Build translator, vocabulary-tail, mask-layout, step-timeline, vram-activations, runtime, fused-mask and matmul unit tests
        run: |
          cmake --build .work/build --target omarchy_custom_kernel_translate_tests \
            omarchy_vocab_tail_tests omarchy_sdpa_decode_mask_layout_tests \
            omarchy_step_timeline_tests omarchy_step_timeline_eval_tests \
            omarchy_vram_activations_tests omarchy_runtime_tests \
            omarchy_sdpa_decode_fused_tests omarchy_matmul_family_tests
      - name: Run the translator unit tests
        run: ctest --test-dir .work/build -R omarchy_custom_kernel_translate_tests --output-on-failure
      - name: Run standalone mask-layout unit tests
        run: ctest --test-dir .work/build -R '^omarchy_sdpa_decode_mask_layout_tests$' --no-tests=error --output-on-failure
      - name: Run standalone step-timeline unit tests
        run: ctest --test-dir .work/build -R '^omarchy_step_timeline_tests$' --no-tests=error --output-on-failure
      - name: Run standalone vram-activations unit tests
        run: ctest --test-dir .work/build -R '^omarchy_vram_activations_tests$' --no-tests=error --output-on-failure
      - name: Build and run the mask-route option test
        run: |
          cmake --build .work/build --target omarchy_sdpa_decode_mask_flag_tests
          ctest --test-dir .work/build -R '^omarchy_sdpa_decode_mask_flag_tests$' --no-tests=error --output-on-failure
      - name: Build and run the scalar-load publish test (issue 537)
        env:
          MLX_OMARCHY_ALLOW_NON_APPLE: "1"
        run: |
          set -o pipefail
          icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          [[ ${#icds[@]} -eq 1 && -f ${icds[0]} ]]
          export VK_DRIVER_FILES="${icds[0]}"
          cmake --build .work/build --target omarchy_load_scalar_publish_tests
          ctest --test-dir .work/build -R '^omarchy_load_scalar_publish_tests$' --no-tests=error --output-on-failure
      - name: Build the CBQ translate-dump CLI
        run: cmake --build .work/build --target omarchy_custom_kernel_translate_dump
      - name: Install CBQ shader toolchain
        run: |
          sudo apt-get install -y --no-install-recommends \
            glslc spirv-tools python3-pytest python3-numpy
      - name: Check CBQ translation prerequisites
        run: |
          test -x .work/build/tests/omarchy/omarchy_custom_kernel_translate_dump
          command -v glslc
          command -v spirv-val
          command -v spirv-dis
          python3 -c 'import pytest'
      - name: Run custom-kernel Vulkan translation acceptance
        env:
          CBQ_TRANSLATE_DUMP: .work/build/tests/omarchy/omarchy_custom_kernel_translate_dump
        run: |
          set -o pipefail
          python3 -m pytest tests/test_cbq_vulkan_translation.py tests/test_nemotron_bm32_translation.py -v | tee .work/cbq-translation.out
          # Count floor, not exact: the suite grows as contracts get exercised
          # (15 was the nine shipped bodies plus the original refusal set).
          # pipefail fails the step on any pytest failure or error.
          ! grep -qE '[0-9]+ skipped' .work/cbq-translation.out
          ! grep -qE '[0-9]+ failed' .work/cbq-translation.out
          n=$(grep -oE '[0-9]+ passed' .work/cbq-translation.out | tail -n1 | cut -d ' ' -f1)
          test "${n:-0}" -ge 15
      - name: Run vocabulary-tail parity tests (software Vulkan)
        env:
          MLX_OMARCHY_ALLOW_NON_APPLE: "1"
        run: |
          set -o pipefail
          icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          [[ ${#icds[@]} -eq 1 && -f ${icds[0]} ]]
          export VK_DRIVER_FILES="${icds[0]}"
          .work/build/tests/omarchy/omarchy_vocab_tail_tests | tee .work/vocab-tail.out
          ! grep -q 'Skipping:' .work/vocab-tail.out
      - name: Run masked batch-2 BF16 decode parity test (software Vulkan)
        env:
          MLX_OMARCHY_ALLOW_NON_APPLE: "1"
        run: |
          set -o pipefail
          icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          [[ ${#icds[@]} -eq 1 && -f ${icds[0]} ]]
          export VK_DRIVER_FILES="${icds[0]}"
          .work/build/tests/omarchy/omarchy_sdpa_decode_fused_tests \
            --test-case="masked batch-2 BF16 decode keeps the composed score semantics" \
            | tee .work/sdpa-decode-masked.out
          if grep -q 'Skipping:' .work/sdpa-decode-masked.out; then
            exit 1
          fi
          grep -Eq 'test cases: *1 \| *1 passed \| 0 failed' .work/sdpa-decode-masked.out
          grep -Eq 'assertions: *[1-9][0-9]* \| *[1-9][0-9]* passed \| 0 failed' .work/sdpa-decode-masked.out
      - name: Verify opt-in step-timeline dump on software Vulkan
        env:
          MLX_OMARCHY_ALLOW_NON_APPLE: "1"
        run: |
          set -o pipefail
          icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          [[ ${#icds[@]} -eq 1 && -f ${icds[0]} ]]
          export VK_DRIVER_FILES="${icds[0]}"
          .work/build/tests/omarchy/omarchy_step_timeline_eval_tests | tee .work/step-timeline-eval.out
          if grep -q 'Skipping:' .work/step-timeline-eval.out; then
            exit 1
          fi
          grep -q 'test_step_timeline_eval: PASS' .work/step-timeline-eval.out
          rm -f .work/step-timeline.ndjson
          MLX_OMARCHY_STEP_TIMELINE=.work/step-timeline.ndjson \
            .work/build/tests/omarchy/omarchy_sdpa_decode_fused_tests \
            --test-case="masked batch-2 BF16 decode keeps the composed score semantics" \
            | tee .work/step-timeline-test.out
          if grep -q 'Skipping:' .work/step-timeline-test.out; then
            exit 1
          fi
          grep -Eq 'test cases: *1 \| *1 passed \| 0 failed' .work/step-timeline-test.out
          python3 - .work/step-timeline.ndjson <<'PY'
          import json, sys
          path = sys.argv[1]
          with open(path) as f:
              rows = [json.loads(line) for line in f if line.strip()]
          assert len(rows) >= 3, f"expected meta + events + summary, got {len(rows)} rows"
          meta, summary = rows[0], rows[-1]
          assert meta["k"] == "meta" and meta["written"] > 0 and meta["capacity"] >= 1024
          assert summary["k"] == "summary" and summary["totals"]
          events = rows[1:-1]
          assert len(events) > 0
          seen_kinds = {e["kind"] for e in events}
          required = {
              "step_begin",
              "step_end",
              "cmd_begin",
              "cmd_record",
              "desc_update",
              "pipeline_lookup",
              "queue_submit",
              "wait",
              "readback",
          }
          missing = required - seen_kinds
          assert not missing, f"missing timeline kinds: {sorted(missing)}"
          for e in events:
              assert e["k"] == "e" and e["t0"] >= meta["t0_ns"] and e["dur"] >= 0
          batch_opens = [e["t0"] for e in events if e["kind"] == "step_begin" and e["sub"] == "batch_open"]
          first_ops = [e["t0"] for e in events if e["kind"] in ("pipeline_lookup", "desc_update", "cmd_begin", "cmd_record")]
          assert batch_opens and first_ops and min(batch_opens) <= min(first_ops), (min(batch_opens), min(first_ops))
          print(f"step-timeline OK: written={meta['written']} events={len(events)} kinds={len(seen_kinds)}")
          PY
      - name: Run BM32 projection probe (software Vulkan)
        env:
          MLX_OMARCHY_ALLOW_NON_APPLE: "1"
        run: |
          set -o pipefail
          icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          [[ ${#icds[@]} -eq 1 && -f ${icds[0]} ]]
          export VK_DRIVER_FILES="${icds[0]}"
          .work/build/tests/omarchy/omarchy_matmul_family_tests -tc='*BM32*' \
            | tee .work/bm32-probe.out
          if grep -q 'Skipping:' .work/bm32-probe.out; then
            exit 1
          fi
          grep -Eq 'assertions: *[1-9][0-9]* \| *[1-9][0-9]* passed \| 0 failed' .work/bm32-probe.out
          grep -Eq 'test cases: *2 \| *2 passed \| 0 failed' .work/bm32-probe.out
      - name: Run staging transfer and pending-shutdown teardown tests (software Vulkan)
        env:
          MLX_OMARCHY_ALLOW_NON_APPLE: "1"
        run: |
          set -o pipefail
          icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          [[ ${#icds[@]} -eq 1 && -f ${icds[0]} ]]
          export VK_DRIVER_FILES="${icds[0]}"
          .work/build/tests/omarchy/omarchy_runtime_tests -tc='*staging*' \
            | tee .work/staging-teardown.out
          if grep -q 'Skipping:' .work/staging-teardown.out; then
            exit 1
          fi
          grep -Eq 'assertions: *[1-9][0-9]* \| *[1-9][0-9]* passed \| 0 failed' .work/staging-teardown.out
          grep -Eq 'test cases: *3 \| *3 passed \| 0 failed' .work/staging-teardown.out
