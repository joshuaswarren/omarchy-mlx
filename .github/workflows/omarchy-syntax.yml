name: Omarchy backend syntax gate

# Deep compile gate for the omarchy overlay translation units, beyond the
# cheap scripts/check_compute_kernel_wiring.py text gate that runs in the
# pre-push hook. Configures the pinned MLX tree (mlx.lock) CPU-only with
# the omarchy backend, builds the 559 embedded SPIR-V shader headers, then
# rewrites every omarchy backend compile to -fsyntax-only
# (scripts/ci/omarchy_syntax_check.py). No link, no GPU, no wheel.
#
# Measured on a 16-core dev box: prepare 7.6 s, configure 6.2 s, shaders
# 8.7 s (~80 s CPU), syntax 12.5 s (~46 s CPU) — a 4-vCPU runner fits the
# whole job in roughly 2-3 minutes including apt.
#
# The translate-tests job below runs the omarchy_custom_kernel_translate_tests
# unit suite for the MSL->GLSL translator, which the syntax-only gate cannot
# execute (no link). Same pinned source archive and toolchain; builds CPU-only
# libmlx plus the test target and runs the suite. Measured on a 16-core dev
# box capped at -j4: prepare 3 s, configure 28 s, shaders 29 s, test target
# 197 s, suite 0.3 s — under the 15-minute mark where the issue would demand
# a path filter, so it runs on every push and PR like the syntax job.
#
# Preprocessor-state limitation: the backend's bf16 direct GEMM path is
# enabled only when the configured shader compiler accepts GL_EXT_bfloat16
# (shaderc/glslc and recent glslang do; glslang 12 does not). The probe at
# configure time picks the state, so the gate always validates the exact
# state a build on that toolchain would compile; glslc-only coverage comes
# from the jw16 gate builds.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: omarchy-syntax-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@v4
      - name: Cache pinned MLX source archive
        uses: actions/cache@v4
        with:
          path: .work/mlx-*.tar.gz
          key: mlx-archive-${{ hashFiles('mlx.lock') }}
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build glslang-tools libvulkan-dev \
            libopenblas-dev libblas-dev liblapack-dev liblapacke-dev
      - name: Test syntax-check command handling
        run: python3 -m unittest discover -s tests -p test_omarchy_syntax_check.py -v
      - name: Prepare patched MLX tree
        run: bash scripts/prepare-mlx.sh
      - name: Configure (CPU-only, omarchy backend)
        env:
          CMAKE_INCLUDE_PATH: /usr/include/openblas
        run: |
          cmake -S .work/mlx -B .work/build -G Ninja \
            -DMLX_BUILD_OMARCHY=ON -DMLX_BUILD_CPU=ON \
            -DMLX_BUILD_METAL=OFF -DMLX_BUILD_CUDA=OFF \
            -DMLX_BUILD_TESTS=OFF -DMLX_BUILD_EXAMPLES=OFF \
            -DMLX_BUILD_BENCHMARKS=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_BUILD_TYPE=Release
      - name: Build embedded shader headers
        run: cmake --build .work/build --target omarchy_shaders
      - name: Syntax-check omarchy translation units
        run: python3 scripts/ci/omarchy_syntax_check.py .work/build --jobs 2

  translate-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@v4
      - name: Cache pinned MLX source archive
        uses: actions/cache@v4
        with:
          path: .work/mlx-*.tar.gz
          key: mlx-archive-${{ hashFiles('mlx.lock') }}
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build glslang-tools libvulkan-dev \
            libopenblas-dev libblas-dev liblapack-dev liblapacke-dev mesa-vulkan-drivers
      - name: Prepare patched MLX tree
        run: bash scripts/prepare-mlx.sh
      - name: Configure (CPU-only, omarchy backend, unit tests)
        env:
          CMAKE_INCLUDE_PATH: /usr/include/openblas
        run: |
          cmake -S .work/mlx -B .work/build -G Ninja \
            -DMLX_BUILD_OMARCHY=ON -DMLX_BUILD_CPU=ON \
            -DMLX_BUILD_METAL=OFF -DMLX_BUILD_CUDA=OFF \
            -DMLX_BUILD_TESTS=ON -DMLX_BUILD_EXAMPLES=OFF \
            -DMLX_BUILD_BENCHMARKS=OFF -DMLX_BUILD_PYTHON_BINDINGS=OFF \
            -DCMAKE_BUILD_TYPE=Release
      - name: Build translator and vocabulary-tail unit tests
        run: |
          cmake --build .work/build --target omarchy_shaders
          cmake --build .work/build --target omarchy_custom_kernel_translate_tests omarchy_vocab_tail_tests
      - name: Run the translator unit tests
        run: ctest --test-dir .work/build -R omarchy_custom_kernel_translate_tests --output-on-failure
      - name: Run vocabulary-tail parity tests (software Vulkan)
        env:
          MLX_OMARCHY_ALLOW_NON_APPLE: "1"
        run: |
          set -o pipefail
          icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          [[ ${#icds[@]} -eq 1 && -f ${icds[0]} ]]
          export VK_DRIVER_FILES="${icds[0]}"
          .work/build/tests/omarchy/omarchy_vocab_tail_tests | tee .work/vocab-tail.out
          ! grep -q 'Skipping:' .work/vocab-tail.out
