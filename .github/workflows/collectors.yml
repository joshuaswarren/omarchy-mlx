name: Community collectors

on:
  pull_request:
    paths:
      - 'install.sh'
      - 'scripts/apply-mlx-lm-patches.sh'
      - 'patches/mlx-lm-kv-host-offset.patch'
      - 'scripts/patch-mlx-lm-*.py'
      - 'scripts/collect*.py'
      - 'scripts/test_collect*.py'
      - 'scripts/mlx_provenance.py'
      - 'scripts/bench_matrix.py'
      - 'tests/**'
      - 'qualification-kit/**'
      - 'services/community-data/schema/**'
      - '.github/workflows/collectors.yml'
  push:
    paths:
      - 'install.sh'
      - 'scripts/apply-mlx-lm-patches.sh'
      - 'patches/mlx-lm-kv-host-offset.patch'
      - 'scripts/patch-mlx-lm-*.py'
      - 'scripts/collect*.py'
      - 'scripts/test_collect*.py'
      - 'scripts/mlx_provenance.py'
      - 'scripts/bench_matrix.py'
      - 'tests/**'
      - 'qualification-kit/**'
      - 'services/community-data/schema/**'
      - '.github/workflows/collectors.yml'

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - run: python scripts/test_collect.py
      - run: python scripts/test_collect_macos.py
      - run: python -m unittest discover -s tests -p test_mlx_provenance.py
      - run: python scripts/bench_matrix.py --self-test
      - run: python -m pytest -q qualification-kit/test_receipt.py qualification-kit/test_reference.py qualification-kit/test_m5_kit.py
      # tests/ covers the serve, assistant and ANE stack, which runs on Linux
      # only (/proc, /usr/bin/bash, process start times). The macOS legs keep
      # the collector steps above.
      - run: pytest tests -q
        if: runner.os == 'Linux'
      - name: Run installer-backed CPU regressions
        if: runner.os == 'Linux' && matrix.python == '3.11'
        env:
          MLX_TEST_UPSTREAM_CPU: "1"
        run: |
          python -m pip install 'mlx[cpu]==0.32.4' transformers jinja2
          python -m pytest -q -rP \
            tests/test_apply_mlxlm_series.py::test_host_offset_mirror_tracks_device_through_transitions \
            tests/test_apply_mlxlm_series.py::test_bitlinear_fallback_on_upstream_cpu \
            tests/test_mlxlm_speculative_lookup.py \
            tests/test_transformers_advisory.py \
            tests/test_chat_torch_free.py \
            tests/test_mlxlm_kv_presize.py \
            --junitxml="$RUNNER_TEMP/installer-cpu.xml"
          # pytest returns success for an all-skipped run. The speculative
          # file gates its TOY/ROUTE subprocess cases on mlx.core and
          # transformers — without them the four lookups skip silently and a
          # faulty verify port passes CI (the #582 escape). The kv-presize
          # cases gate on mlx.core and rebuild a pinned mlx_lm in a pristine
          # venv; advisory and chat-torch-free gate on transformers, and the
          # chat path additionally imports jinja2 through the coordinator.
          # The advisory intentionally wants transformers WITHOUT torch —
          # torch is not installed on these runners.
          python - "$RUNNER_TEMP/installer-cpu.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          cases = ET.parse(sys.argv[1]).findall(".//testcase")
          if len(cases) != 36 or any(case.find("skipped") is not None for case in cases):
              sys.exit("Expected one host-offset, two BitLinear, ten speculative-lookup, two transformers-advisory, one chat-torch-free and twenty kv-presize CPU regressions")
          PY
