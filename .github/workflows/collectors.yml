name: Community collectors

on:
  pull_request:
    paths:
      - 'install.sh'
      - 'scripts/apply-mlx-lm-patches.sh'
      - 'patches/mlx-lm-kv-host-offset.patch'
      - 'scripts/patch-mlx-lm-*.py'
      - 'scripts/collect*.py'
      - 'scripts/test_collect*.py'
      - 'scripts/mlx_provenance.py'
      - 'scripts/bench_matrix.py'
      - 'tests/**'
      - 'qualification-kit/**'
      - 'services/community-data/schema/**'
      - '.github/workflows/collectors.yml'
  push:
    paths:
      - 'install.sh'
      - 'scripts/apply-mlx-lm-patches.sh'
      - 'patches/mlx-lm-kv-host-offset.patch'
      - 'scripts/patch-mlx-lm-*.py'
      - 'scripts/collect*.py'
      - 'scripts/test_collect*.py'
      - 'scripts/mlx_provenance.py'
      - 'scripts/bench_matrix.py'
      - 'tests/**'
      - 'qualification-kit/**'
      - 'services/community-data/schema/**'
      - '.github/workflows/collectors.yml'

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - run: python scripts/test_collect.py
      - run: python scripts/test_collect_macos.py
      - run: python -m unittest discover -s tests -p test_mlx_provenance.py
      - run: python scripts/bench_matrix.py --self-test
      - run: python -m pytest -q qualification-kit/test_receipt.py qualification-kit/test_reference.py
      # tests/ covers the serve, assistant and ANE stack, which runs on Linux
      # only (/proc, /usr/bin/bash, process start times). The macOS legs keep
      # the collector steps above.
      - run: pytest tests -q
        if: runner.os == 'Linux'
      - name: Run legacy host-offset transitions on CPU
        if: runner.os == 'Linux' && matrix.python == '3.11'
        env:
          MLX_TEST_UPSTREAM_CPU: "1"
        run: |
          python -m pip install 'mlx[cpu]==0.32.4'
          python -m pytest -q -rP \
            tests/test_apply_mlxlm_series.py::test_host_offset_mirror_tracks_device_through_transitions \
            --junitxml="$RUNNER_TEMP/host-offset.xml"
          # pytest returns success for an all-skipped run.
          python - "$RUNNER_TEMP/host-offset.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          cases = ET.parse(sys.argv[1]).findall(".//testcase")
          if len(cases) != 1 or cases[0].find("skipped") is not None:
              sys.exit("Expected one executed host-offset regression")
          PY
